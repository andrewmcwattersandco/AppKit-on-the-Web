<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html -->
    <meta name="viewport" content="user-scalable=no, width=device-width, viewport-fit=cover">
    <title>AppKit on the Web</title>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const base          = document.createElement('base');
        const isLocalhost   = location.hostname === 'localhost';
        const isPrivateIPv4 = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3})$/.test(location.hostname);
        const isPrivateIPv6 = /^((fc00|fd00)::|fe80::)/.test(location.hostname);
              base.href     = isLocalhost || isPrivateIPv4 || isPrivateIPv6 ? './' : '/AppKit-on-the-Web/';
        document.head.appendChild(base);
      });
    </script>
    <link rel="stylesheet" href="../stylesheets/AppKit.css">
  </head>
  <body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;">
    <div class="appkit-menu" style="width: 204px; --height: 105px;">
      <ol style="margin: 0; padding: 0; list-style: none;">
        <input type="text" class="appkit-text-field rounded --appkit-menu-item" placeholder="Search">
        <li class="appkit-menu-item-header">Label</li>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
        <hr>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
        <li class="appkit-menu-item">List</li>
      </ol>
    </div>
  </body>
</html>
