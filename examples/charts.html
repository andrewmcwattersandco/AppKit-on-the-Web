<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html -->
    <meta name="viewport" content="user-scalable=no, width=device-width, viewport-fit=cover">
    <title>AppKit on the Web</title>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const base = document.createElement('base');
        base.href = location.hostname === 'localhost' ? './' : '/AppKit-on-the-Web/';
        document.head.appendChild(base);
      });
    </script>
    <link rel="stylesheet" href="./stylesheets/AppKit.css">
  </head>
  <body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;">
    <svg class="appkit-chart" style="width: 431px; height: 134.5px;">
      <g class="x axis" stroke-dasharray="2,2">
        <line x1="1"   y1="5"    x2="1"   y2="112"></line>
        <line x1="51"  y1="5"    x2="51"  y2="134" stroke-dasharray="none"></line>
        <line x1="101" y1="5"    x2="101" y2="112"></line>
        <line x1="151" y1="5"    x2="151" y2="112"></line>
        <line x1="201" y1="5"    x2="201" y2="112"></line>
        <line x1="251" y1="5"    x2="251" y2="112"></line>
        <line x1="301" y1="5"    x2="301" y2="112"></line>
        <line x1="351" y1="5"    x2="351" y2="112"></line>
        <line x1="401" y1="5"    x2="401" y2="112"></line>
      </g>
      <g class="y axis">
        <line x1="1"   y1="5"    x2="401" y2="5"   ></line>
        <line x1="1"   y1="27.5" x2="401" y2="27.5"></line>
        <line x1="1"   y1="50"   x2="401" y2="50"  ></line>

        <line x1="1"   y1="95"   x2="401" y2="95"  ></line>
      </g>
      <g class="x labels">
        <text x="4"   y="111">9     </text>
        <text x="54"  y="111">12 A  </text>
        <text x="54"  y="132">Mar 29</text>
        <text x="104" y="111">3     </text>
        <text x="154" y="111">6     </text>
        <text x="204" y="111">9     </text>
        <text x="254" y="111">12 P  </text>
        <text x="304" y="111">3     </text>
        <text x="354" y="111">6     </text>
      </g>
      <g class="y labels">
        <text x="405" y="9"  >60m</text>
        <text x="405" y="55" >30m</text>
        <text x="405" y="100">0m </text>
      </g>
    </svg>
  </body>
</html>
