<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html -->
    <meta name="viewport" content="width=device-width, viewport-fit=cover">
    <title>AppKit on the Web</title>
    <script src="../javascripts/base.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../stylesheets/AppKit.css">
  </head>
  <body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;">
    <div class="appkit-backdrop" style="z-index: -1;"></div>
    <div class="appkit-sheet" style="width: 672px; height: 425px;">
      <div class="sidebar">
      </div>
      <div class="content-area">
        <div class="toolbar">
          <div class="button-group" style="margin-left: auto;">
            <button>1</button>
            <button>2</button>
            <button>3</button>
          </div>
        </div>
        <div class="scroll-view">
        </div>
        <div class="confirmation-buttons" style="text-align: right;">
          <button class="appkit-button" style="margin-right: 8px;">Cancel</button>
          <button class="appkit-button primary">Save</button>
        </div>
      </div>
    </div>
  </body>
</html>
