<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html -->
    <meta name="viewport" content="user-scalable=no, width=device-width, viewport-fit=cover">
    <title>AppKit on the Web</title>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const hostname      = location.hostname;
        const isLocalhost   = hostname === 'localhost';
        const isLoopback    = hostname === '127.0.0.1' || hostname === '::1';
        const isPrivateIPv4 = /^(10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172(?:\.1[6-9]|2[0-9]|3[0-1])(?:\.\d{1,3}){2})$/.test(hostname);
        const isPrivateIPv6 = /^(?:fc00|fd[0-9a-f]{2}|fe80):[0-9a-f:]+$/i.test(hostname);

        if (!document.querySelector('base')) {
          const base = document.createElement('base');
          base.href  = (isLocalhost || isLoopback || isPrivateIPv4 || isPrivateIPv6) ? './' : '/AppKit-on-the-Web/';
          document.head.prepend(base);
        }
      });
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../stylesheets/AppKit.css">
  </head>
  <body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #FFFFFF;">
    <div>
      <h1 class="appkit-form-list-row-header">Header</h1>
      <form class="appkit-form-list" style="width: 461px; --height: 469px;">
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Label
            </div>
            <div class="trailing" style="color: rgba(0,0,0,0.50);">
              Label
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Info
            </div>
            <div class="trailing" style="color: rgba(0,0,0,0.50);">
              <i class="bi bi-info-circle"></i>
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Popup
            </div>
            <div class="trailing" style="color: rgba(0,0,0,0.50);">
              <appkit-pop-up-button id="unittype" name="unittype">
                <option value=""> Label </option>
                <option value="1"> Miner </option>
                <option value="2"> Puffer </option>
                <option value="3"> Snipey </option>
                <option value="4"> Max </option>
                <option value="5"> Firebot </option>
              </appkit-pop-up-button>
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Toggle
            </div>
            <div class="trailing">
              <appkit-switch checked />
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Info Button + Toggle
            </div>
            <div class="trailing" style="color: rgba(0,0,0,0.50); gap: 10px;">
              <i class="bi bi-info-circle"></i><appkit-switch />
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Label + Info Button
            </div>
            <div class="trailing" style="color: rgba(0,0,0,0.50); gap: 10px;">
              Label <i class="bi bi-info-circle"></i>
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Stepper
            </div>
            <div class="trailing">
              <label style="color: rgba(0,0,0,0.50);">
                <input type="number" value="3.00" style="width: 53px;">
              </label>
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Title
            </div>
            <div class="trailing" style="color: rgba(0,0,0,0.50);">
              <appkit-pop-up-button id="unittype" name="unittype">
                <option value=""> Label </option>
                <option value="1"> Miner </option>
                <option value="2"> Puffer </option>
                <option value="3"> Snipey </option>
                <option value="4"> Max </option>
                <option value="5"> Firebot </option>
              </appkit-pop-up-button>
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Title
            </div>
            <div class="trailing" style="color: rgba(0,0,0,0.50);">
              Label
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Title<br>
              <span class="subtitle">Subtitle</span>
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row">
          <div style="display: flex; justify-content: space-between;">
            <div class="leading">
              Title
            </div>
            <div class="trailing">
              <label style="color: rgba(0,0,0,0.50);">
                <input type="number" value="3.00" style="width: 53px;"> seconds
              </label>
            </div>
          </div>
        </div>
        <div class="appkit-form-list-row footer">
          <button class="add">+</button><button class="remove" disabled>-</button>
        </div>
      </form>
    </div>
    <script src="../javascripts/NSPopUpButton.js"></script>
    <script src="../javascripts/NSSwitch.js"></script>
  </body>
</html>
