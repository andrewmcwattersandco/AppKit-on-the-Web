<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/UsingtheViewport/UsingtheViewport.html -->
    <meta name="viewport" content="user-scalable=no, width=device-width, viewport-fit=cover">
    <title>AppKit on the Web</title>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const hostname      = location.hostname;
        const isLocalhost   = hostname === 'localhost';
        const isLoopback    = hostname === '127.0.0.1' || hostname === '::1';
        const isPrivateIPv4 = /^(10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172(?:\.1[6-9]|2[0-9]|3[0-1])(?:\.\d{1,3}){2})$/.test(hostname);
        const isPrivateIPv6 = /^(?:fc00|fd[0-9a-f]{2}|fe80):[0-9a-f:]+$/i.test(hostname);

        if (!document.querySelector('base')) {
          const base = document.createElement('base');
          base.href  = (isLocalhost || isLoopback || isPrivateIPv4 || isPrivateIPv6) ? './' : '/AppKit-on-the-Web/';
          document.head.prepend(base);
        }
      });
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../stylesheets/AppKit.css">
  </head>
  <body style="margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;">
    <nav class="appkit-sidebar" style="width: 200px; --height: 492px;">
      <ol style="margin: 0; padding: 0; list-style: none;">
        <li class="appkit-sidebar-list-section-title">
          Favorites
        </li>
        <li class="appkit-sidebar-list-item selected">
          <i class="icon bi bi-question-square"></i>
          <span class="label">AirDrop</span>
        </li>
        <li class="appkit-sidebar-list-item">
          <i class="icon bi bi-question-square"></i>
          <span class="label">Recents</span>
        </li>
        <li class="appkit-sidebar-list-item">
          <i class="icon bi bi-question-square"></i>
          <span class="label">Applications</span>
        </li>
        <li class="appkit-sidebar-list-item">
          <i class="icon bi bi-question-square"></i>
          <span class="label">Desktop</span>
        </li>
        <li class="appkit-sidebar-list-item">
          <i class="icon bi bi-question-square"></i>

        </li>
        <li class="appkit-sidebar-list-item">

      <ol style="margin: 0; padding: 0; list-style: none;">

          <i class="icon bi bi-question-square"></i>

      </ol>
      <ol style="margin: 0; padding: 0; list-style: none;">
        <li class="appkit-sidebar-list-section-title">
          Tags
        </li>
      </ol>
    </div>
  </body>
</html>
